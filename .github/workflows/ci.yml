name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @shootspot/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: shootspot
          POSTGRES_PASSWORD: shootspot-dev
          POSTGRES_DB: shootspot
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U shootspot -d shootspot"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=shootspot-dev -e AWS_SECRET_ACCESS_KEY=shootspot-dev-secret \
            chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=256
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333 && break; sleep 1; done
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
