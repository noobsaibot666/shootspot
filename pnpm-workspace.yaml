  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - babel-preset-expo@58.0.16
  - expo-asset@58.0.16
  - expo-modules-core@58.0.20
  - expo-modules-jsi@58.0.14
  - expo@58.0.12
  - react-native@0.88.0
  - vitest@5.0.5
